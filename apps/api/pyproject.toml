[project]
name = "leadradar"
version = "0.2.0"
description = "Self-hosted, rule-based business discovery, digital presence auditing and lead management."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "fastapi==0.165.0",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.9",
  "psycopg[binary]==3.3.9",
  "alembic==1.20.1",
  "pydantic==2.14.4",
  "pydantic-settings==2.16.3",
  "argon2-cffi==25.1.0",
  "pyotp==2.12.1",
  "segno==1.6.6",
  "httpx==0.29.0",
  "selectolax==1.0.2",
  "tldextract==5.4.0",
  "idna==3.20",
  "cryptography==50.0.2",
  "psutil==7.2.2",
  "nh3==0.3.8",
  "jinja2==3.1.6",
  "python-multipart==0.0.34",
]

[project.optional-dependencies]
discovery = ["osmium==4.3.2"]
analysis = ["playwright==1.65.2", "pillow==13.0.0"]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "ruff==0.17.6", "mypy==2.4.1"]

[project.scripts]
leadradar = "leadradar.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["leadradar*"]

[tool.setuptools.package-data]
leadradar = ["seeds/data/*.json", "templates/*.html", "templates/*.css", "templates/fonts/*", "modules/website_audit/*.js"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"migrations/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires a PostgreSQL database (TEST_DATABASE_URL)", "live: explicitly enabled live provider smoke tests"]
